@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{--paper:#F5F7F8;--panel:#FFFFFF;--ink:#1E2A32;--muted:#56646E;--rule:#D3DBE0;--accent:#1F5F8B;--flag-bg:#FFF1D0;--flag-ink:#7A4B00;--grid:#E3E8EB;color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:12px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
a{color:var(--accent)}a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding:22px 32px 14px}
h1{font-size:1.65rem;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);max-width:78ch}
.simflag{margin:0;background:var(--flag-bg);color:var(--flag-ink);padding:6px 12px;border-radius:4px;font-weight:700}
.petbar{height:6px;background:linear-gradient(90deg,#000 0%,#5a0000 18%,#b31b00 38%,#ee6a00 58%,#ffb000 76%,#ffe680 90%,#fffbe6 100%)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;padding:24px 32px 48px;max-width:1500px}
.toc{position:sticky;top:16px;align-self:start;font-size:.95rem}
.toc ol{list-style:none;margin:0 0 18px;padding:0}.toc li{margin:0 0 6px}
.toc a{text-decoration:none;display:grid;grid-template-columns:1.7em 1fr}.toc a b{color:var(--muted)}
.toc label{display:block;font-weight:700;margin-bottom:4px}
.toc select{width:100%;font:inherit;padding:6px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink)}
.toc p{color:var(--muted);font-size:.85rem;margin:6px 0 0}
section{margin:0 0 44px}
h2{font-size:1.3rem;margin:0 0 6px;display:flex;gap:12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2 .code{color:var(--accent);min-width:1.2em}
.intro{color:var(--muted);max-width:80ch;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr));gap:18px}
.panel{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px 14px 10px;min-width:0}
.panel figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.panel figcaption span{color:var(--muted);font-size:.9rem}
.chart{height:420px}.chart.tall{height:540px}
.panel img{width:100%;height:auto;display:block;background:#fff;border-radius:2px}
.open{font-size:.85rem;display:inline-block;margin-top:6px}
.counts{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;background:var(--panel);margin:8px 0 18px}
.counts div{padding:10px 18px;border-right:1px solid var(--rule)}.counts div:last-child{border-right:0}
.counts b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}.counts span{color:var(--muted);font-size:.85rem}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--panel);max-height:560px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{position:sticky;top:0;background:var(--panel)}tr:last-child td{border-bottom:0}
.notes li{margin-bottom:6px;max-width:85ch}
footer{padding:18px 32px 28px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--rule)}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:16px}.toc{position:static}.toc ol{display:flex;flex-wrap:wrap;gap:6px 18px}.top{padding:16px}}

function themed(l){var L=JSON.parse(JSON.stringify(l||{}));L.paper_bgcolor='rgba(0,0,0,0)';L.plot_bgcolor='rgba(0,0,0,0)';
 L.font=Object.assign({family:"'Atkinson Hyperlegible', system-ui, sans-serif",color:cssv('--ink'),size:13},L.font||{});
 ['xaxis','yaxis'].forEach(function(a){L[a]=Object.assign({gridcolor:cssv('--grid'),linecolor:cssv('--rule'),zerolinecolor:cssv('--rule')},L[a]||{});});return L;}
var CFG={responsive:true,displaylogo:false,toImageButtonOptions:{format:'png',scale:2}};
function highlight(){var s=document.getElementById('hl');var v=s?s.value:'all';
 document.querySelectorAll('.chart.bp').forEach(function(el){if(!el.data)return;
  Plotly.restyle(el,{opacity:el.data.map(function(t){return(v==='all'||t.name===v)?1:0.12;})});});}
function drawAll(){Object.keys(FIGS).forEach(function(k){var el=document.getElementById(k);if(el)Plotly.react(el,FIGS[k].data,themed(FIGS[k].layout),CFG);});highlight();}
if(window.Plotly){drawAll();var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',drawAll);
 var s=document.getElementById('hl');if(s)s.addEventListener('change',highlight);}
else{document.querySelectorAll('.chart').forEach(function(e){e.innerHTML='<p class="simflag">The interactive chart needs plotly.js: keep the lib folder next to this page, or open it with an internet connection.</p>';});}
